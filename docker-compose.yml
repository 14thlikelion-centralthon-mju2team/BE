services:
  postgres:
    image: postgres:16
    container_name: backend-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-backend}
      POSTGRES_USER: ${DB_USER:-backend}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-backend}
    # 운영 시 포트 퍼블리시 제거 — 내부 네트워크만 접근
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-backend}"]
      interval: 5s
      timeout: 3s
      retries: 5

  plan-engine:
    build:
      context: ./ai/plan-engine
    container_name: backend-plan-engine
    environment:
      PYTHONUNBUFFERED: "1"
    # 포트 외부 노출 불필요 — api가 내부 네트워크로 접근
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build: .
    container_name: backend-api
    depends_on:
      postgres:
        condition: service_healthy
      plan-engine:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-backend}
      DB_USER: ${DB_USER:-backend}
      DB_PASSWORD: ${DB_PASSWORD:-backend}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before deploying}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET before deploying}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?set ENCRYPTION_SALT before deploying}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      PLAN_ENGINE_BASE_URL: http://plan-engine:8000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: backend-nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS 인증서 (가비아 도메인 확정 후 certbot으로 발급)
      # - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
