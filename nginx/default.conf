upstream api {
    server api:8080;
}

upstream plan_engine {
    server plan-engine:8000;
}

server {
    listen 80;
    server_name _;

    # API 요청 → Spring Boot
    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 (Plan Engine 호출이 포함될 수 있으므로 여유 있게)
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Plan Engine 내부 API (외부 노출 차단 — 필요 시 주석 해제)
    # location /internal/ {
    #     return 404;
    # }

    # Health check
    location /health {
        proxy_pass http://api/actuator/health;
    }
}

