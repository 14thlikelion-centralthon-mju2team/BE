upstream api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    # TLS는 인증서가 provision된 외부 load balancer 또는 별도 TLS 구성에서 종단한다.
    # 인증서 없이 443을 publish하지 않아 잘못된 HTTPS endpoint를 노출하지 않는다.
    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 외부 상태 점검은 Spring Actuator의 liveness/readiness 대신 단순 health로 프록시한다.
    location = /health {
        proxy_pass http://api/actuator/health;
        proxy_set_header Host $host;
    }
}
