# nginx/production.conf — AWS 운영 환경용 TLS 설정
# 이 파일은 실제 배포 서버에서 default.conf 대신 마운트한다.
# 도메인: api.ensom.shop (AWS EC2: 43.201.169.167)

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream api {
    server api:8080;
}

server {
    listen 80;
    server_name api.ensom.shop;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.ensom.shop;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.ensom.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ensom.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS preflight
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Idempotency-Key' always;
        add_header 'Access-Control-Max-Age' '3600' always;
        add_header 'Content-Length' '0';
        return 204;
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://api/actuator/health;
        proxy_set_header Host $host;
    }
}
