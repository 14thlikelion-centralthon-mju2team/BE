limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream api {
    server api:8080;
}

server {
    listen 80;
    server_name api.ensom.shop;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://api.ensom.shop$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.ensom.shop;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/api.ensom.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ensom.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /health {
        proxy_pass http://api/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Browser-facing verification links intentionally omit the API /v1 prefix.
    # Do not expose the remaining unversioned Spring routes.
    location = /auth/email/verify {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # FE public base URL(/v1)과 Spring root mapping을 연결한다.
    # trailing slash가 있는 proxy_pass는 /v1/ prefix를 제거한다.
    location /v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
