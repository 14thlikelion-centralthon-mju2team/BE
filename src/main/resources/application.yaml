spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backend}
    username: ${DB_USER:backend}
    password: ${DB_PASSWORD:backend}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_APP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
  jackson:
    # FE와 합의: camelCase (Jackson 기본값) 사용. SNAKE_CASE 설정 제거됨.
    mapper:
      # API 명세의 enum wire value는 소문자(too_early)인데 요청 DTO는 Java enum 상수(TOO_EARLY)를
      # 그대로 받는다 — actions/feedback/resolve 등 enum 필드가 있는 모든 요청 바디에 적용된다.
      accept-case-insensitive-enums: true

oauth:
  google:
    token-info-url: https://oauth2.googleapis.com/tokeninfo
    token-url: https://oauth2.googleapis.com/token
    # ponytail: Vium용 구글 OAuth 클라이언트 ID/시크릿 미발급 — 발급 전까지 aud 검증·토큰 교환이
    # 항상 실패함(fail-closed). calendar.readonly 스코프로 새로 발급받아야 함(로그인용 client-id와
    # 같은 프로젝트여도 client-secret은 별도 발급 필요 — 로그인은 id_token 검증만 해서 안 씀).
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
    calendar-events-url: https://www.googleapis.com/calendar/v3/calendars/primary/events

plan-engine:
  base-url: ${PLAN_ENGINE_BASE_URL:http://localhost:8000}

provider:
  odsay:
    # 서버 플랫폼 키는 ODSAY_API_KEY 환경변수로만 주입한다. 비어 있으면 StubRouteProvider가 사용된다.
    api-key: ${ODSAY_API_KEY:}
    route-url: https://api.odsay.com/v1/api/searchPubTransPathT
    connect-timeout-ms: ${ODSAY_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ODSAY_READ_TIMEOUT_MS:3000}
  kma:
    # ponytail: 공공데이터포털 인증키 미발급 — 발급 전까지 KmaEnvironmentProvider는 호출 시 실패한다.
    # 아직 @Component가 아니라 StubEnvironmentProvider가 쓰이므로 지금은 실행 경로에 안 걸림.
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    forecast-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst

app:
  jwt:
    # ponytail: 로컬 개발용 기본값. 배포 시 JWT_SECRET 환경변수로 반드시 교체 (setting/security 티켓)
    secret: ${JWT_SECRET:dev-only-local-jwt-secret-must-be-at-least-64-bytes-long-for-hmac-sha512!!}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 1209600000
  encryption:
    # ponytail: 로컬 개발용 기본값. 배포 시 두 값 다 환경변수로 반드시 교체 (setting/security 티켓).
    # salt는 BytesEncryptor가 요구하는 hex 문자열 형식.
    secret: ${ENCRYPTION_SECRET:dev-only-local-encryption-secret-change-before-deploy}
    salt: ${ENCRYPTION_SALT:deadbeefdeadbeefdeadbeefdeadbeef}
  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:true}
    token-ttl-minutes: ${EMAIL_VERIFICATION_TOKEN_TTL_MINUTES:1440}
    resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:8080}
    smtp:
      enabled: ${SMTP_ENABLED:false}
      from: ${SMTP_FROM:}

firebase:
  # 서비스 계정 키 경로. 설정하지 않으면 StubFcmSender가 사용됨.
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
