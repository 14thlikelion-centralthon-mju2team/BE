spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backend}
    username: ${DB_USER:backend}
    password: ${DB_PASSWORD:backend}
  jpa:
    hibernate:
      # ponytail: #6(V1__init.sql) 머지 전까지 update. 머지 후 dev로 리베이스하면서 validate로 되돌릴 것
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

oauth:
  google:
    token-info-url: https://oauth2.googleapis.com/tokeninfo
    # ponytail: Vium용 구글 OAuth 클라이언트 ID 미발급 — 발급 전까지 aud 검증이 항상 실패함(fail-closed)
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:}

app:
  jwt:
    # ponytail: 로컬 개발용 기본값. 배포 시 JWT_SECRET 환경변수로 반드시 교체 (setting/security 티켓)
    secret: ${JWT_SECRET:dev-only-local-secret-change-before-deploy-32bytes-min}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 1209600000
