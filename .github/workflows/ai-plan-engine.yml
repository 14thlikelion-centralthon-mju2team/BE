name: AI Plan Engine

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/plan-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai/plan-engine/pyproject.toml
      - name: Install dependencies
        run: python -m pip install '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Tests
        run: pytest
